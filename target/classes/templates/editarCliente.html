<!DOCTYPE html>
<html lang="en"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Editar Usuario</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-datepicker/1.9.0/css/bootstrap-datepicker.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-gH2yIJqKdNHPEq0n4Mqa/HGKIhSkIHeL5AyhkYV8i59U5AR6csBvApHHNl/vI1Bx" crossorigin="anonymous">
    <link th:href="@{/css/estilo.css}" rel="stylesheet">
    <script src="https://kit.fontawesome.com/cab137a5a8.js" crossorigin="anonymous"></script>
</head>
<body>
  <header th:insert="fragments/nav_bar::nav_bar"></header>

  <div class="container">
    <form th:action="@{/usuario/carteraClientes/actualizar}" method="post" enctype="multipart/form-data">
        <div class="card-header">Editar Usuario</div>
        <div class="card-body">
            <div class="row">
                <div class="col-4">
                    <img id="imageAvatar" th:src="@{ /avatars/{img} (img=${cliente.avatar}) }" class="rounded-circle imageAvatarDetalles mandarAIzquierda" alt="Sin Avatar">
                </div>
                <div class="col-4">
                    <input id="inputNameAvatar" type="text" name="avatar" th:field="*{cliente.avatar}"></input>
                    <div th:text="${cliente.avatar}" class="espacioInferior25pixeles">Nombre Imagen</div>
                    <div class="form-check form-switch">
                         <input name="estatus" id="flexSwitchCheckDefault" class="form-check-input" type="checkbox" th:field="*{cliente.habilitado}"> 
                        <label id="flexSwitchCheckDefaultText" class="form-check-label" for="flexSwitchCheckDefault">Activo/Bloqueado</label>
                    </div>
                </div>
                <div class="col-4">
                    <h6>Subir Avatar</h6>
                    <input type="file" class="form-control" name="imagenAvatarUsuario"></input>
                </div>
            </div>
            <hr/>
            <div class="col-12">
                <div class="mb-3">
                     <div class="row" >
                        <div id="idUsuario" class="mb-3">
                            <label class="form-label">Id Usuario</label>
                            <input type="text" name="idUsuario" th:field="*{cliente.id}" class="form-control" id="inputName" aria-describedby="name">
                            <div id="idHelp" class="form-text">Id</div>
                        </div>
                        <div class="row">
                            <div class="col-3">
                                <label class="form-label">Nombres</label>
                            </div>
                            <div class="col-9 espacioInferior25pixeles">
                                <input type="text" onkeyup="mayus(this);" name="nombre" th:field="*{cliente.nombre}" class="form-control" id="inputNombre" required>
                                <div id="nombresHelp" class="form-text"></div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-3">
                                <label class="form-label">Apellido Paterno</label>
                            </div>
                            <div class="col-9 espacioInferior25pixeles">
                                <input type="text" onkeyup="mayus(this);" name="paterno" th:field="*{cliente.paterno}" class="form-control" id="inputPaterno" required>
                                <div id="paternoHelp" class="form-text"></div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-3">
                                <label class="form-label">Apellido Materno</label>
                            </div>
                            <div class="col-9 espacioInferior25pixeles">
                                <input type="text" onkeyup="mayus(this);" name="materno" th:field="*{cliente.materno}" class="form-control" id="inputMaterno" required>
                                <div id="maternoHelp" class="form-text"></div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-3">
                                <label class="form-label">Correo Electrónico</label>
                            </div>
                            <div class="col-9 espacioInferior25pixeles">
                                <input type="email" onkeyup="mayus(this);" name="email" th:field="*{cliente.mail}" class="form-control" id="inputEmail" aria-describedby="name" required>
                                <div id="emailHelp" class="form-text"></div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-3">
                                <label class="form-label">RFC</label>
                            </div>
                            <div class="col-9 espacioInferior25pixeles">
                                <input type="text" onkeyup="mayus(this);" name="rfc" th:field="*{cliente.rfc}" class="form-control" id="inputRfc" required>
                                <div id="rfcHelp" class="form-text"></div>
                            </div>
                        </div>
                        <div id="devRazonSocial" class="row">
                            <div class="col-3">
                                <label class="form-label">Razón Social</label>
                            </div>
                            <div class="col-9 espacioInferior25pixeles">
                                <input id="inputRazonSocialUsuario" type="text" onkeyup="mayus(this);" name="razonSocial" th:field="*{cliente.razonSocial}" class="form-control">
                                <div id="razonSocialHelp" class="form-text"></div>
                            </div>
                        </div>
                        <div id="devContactoUsuario" class="row">
                            <div class="col-3">
                                <label class="form-label">Contacto</label>
                            </div>
                            <div class="col-9 espacioInferior25pixeles">
                                <input id="inputContactoUsuario" type="text" onkeyup="mayus(this);" name="contacto" th:field="*{cliente.contacto}" class="form-control">
                                <div id="contactoHelp" class="form-text"></div>
                            </div>
                        </div>
                        <div id="devTelPersonalUsuario" class="row">
                            <div class="col-3">
                                <label class="form-label">Teléfono Personal</label>
                            </div>
                            <div class="col-9 espacioInferior25pixeles">
                                <input id="inputTelPersonalUsuario" type="text" onkeyup="mayus(this);" name="telPersonal" th:field="*{cliente.telPersonal}" class="form-control">
                                <div id="telPersonalHelp" class="form-text"></div>
                            </div>
                        </div>
                        <div id="devTelOficinaUsuario" class="row">
                            <div class="col-3">
                                <label class="form-label">Teléfono de Oficina</label>
                            </div>
                            <div class="col-9 espacioInferior25pixeles">
                                <input id="inputTelOficinaUsuario" type="text" onkeyup="mayus(this);" name="telOficina" th:field="*{cliente.telOficina}" class="form-control">
                                <div id="telOficinaHelp" class="form-text"></div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-3">
                                <label class="form-label">contraseña</label>
                            </div>
                            <div class="col-9 espacioInferior25pixeles">
                                <input type="password" th:field="*{cliente.password}" name="password" class="form-control" id="inputPassword" aria-describedby="name" required>
                                <div id="helpPass" class="form-text"></div>
                            </div>
                        </div>
                        <div id="devComentarios" class="row">
                            <div class="col-3">
                                <label class="form-label">Comentarios</label>
                            </div>
                            <div class="col-9 espacioInferior25pixeles">
                                <textarea id="comentariosUsuario" name="comentarios" rows="8" onkeyup="mayus(this);" th:field="*{cliente.comentarios}" class="form-control textareaNoRedimencion"></textarea>
                                <div id="comentariosHelp" class="form-text"></div>
                            </div>
                        </div>
                        <div class="row justify-content-end">
                            <div class="col-4">
                                <a th:href="@{/usuario/carteraClientes}" type="button" class="btn btn-danger">Cancelar</a>
                                <button type="submit" class="btn text-white" style="background-color: #17385f;">Actualizar</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </form>
  </div>

  <footer th:insert="fragments/footer::footer" class="d-flex flex-wrap justify-content-between align-items-center py-3 my-4 border-top"></footer>

  <!-- JavaScript Bundle with Popper -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/js/bootstrap.bundle.min.js"
  integrity="sha384-A3rJD856KowSb7dwlZdYEkO39Gagi7vIsF0jrRAoQmDKKtQBHUuLZ9AsSv4jD4Xa"
  crossorigin="anonymous"></script>
  <script src="https://code.jquery.com/ui/1.12.1/jquery-ui.js"></script>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-datepicker/1.9.0/js/bootstrap-datepicker.min.js"></script>
  <!-- JavaScript para el funcionamiento del modal de detalles de usuario -->
  <script th:src="@{/javascript/Scripts.js}"></script>
</body>
