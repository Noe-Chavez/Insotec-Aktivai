<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
<meta charset="utf-8">
<title>Inicio de sesión</title>
<!-- Latest compiled and minified CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-Zenh87qX5JnK2Jl0vWa8Ck2rdkQ2Bzep5IDxbcnCeuOxjzrPF/et3URy9Bv1WTRi" crossorigin="anonymous">

</head>
<body>


	<nav class="nav navbar-text max-height text-white align-middle"  style="background-color: #ffffff; font-size: 200%;">
        <span class="align-middle" style="margin-left: 5%;"> </span> 
    </nav>
    <div class="container text-center">
	    <div class="row align-items-center" style="text-align: center;">
	        <div class="col" >
	            <br>
	          <img src="https://www.cctvseguridadmexico.com/wp-content/uploads/2021/07/CCTV-Seguridad-Mexico-Logo-1.png" class="img-thumbnail"
	          style="width: 55%; text-align: center;"  alt="Logo Aktivai"  >
	        </div>
	
			<div class="col">
				<div class="card card-signin my-5" style="height: 25rem;">
	                <div class="card-body bg-secondary my-2 align-items-center">
						<h1 class="card-title text-center text-light" text="Iniciar Sesión">Iniciar Sesión</h1>
						<br>
					 	<form id="forma" th:action="@{/j_spring_security_check}" class="form-signin" method="post">
	                    	<div class="form-label-group">
	                        	<input type="email" class="form-control" placeholder="Email" id="j_username" name="j_username" required autofocus/> 
	                            <label for="inputEmail"></label>
	                        </div>
							<br>
	                        <div class="form-label-group">
	                        	<input type="password" class="form-control" placeholder="Password" id="j_password" name="j_password" required/> 
	                            <label for="inputPassword"></label>
	                        </div>
	
	                        
	                        <button id="ingresar" class="btn btn-lg btn-block text-center text-white " type="submit" style="background-color: #17385f;" th:text="Entrar" ></button>
	                    </form>
					
	            	</div> 
	        	</div>
			</div>
		
		</div>
    </div>

	<footer th:insert="fragments/footer::footer" class="d-flex flex-wrap justify-content-between align-items-center py-3 my-4 border-top"></footer>

	<!-- Latest compiled and minified JavaScript -->
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-OERcA2EqjJCMA+/3y+gxIOqMEjwtxJY7qPCqsdltbNJuaOe923+mo//f6V8Qbsw3" crossorigin="anonymous"></script>
  </body>
</body>
</html>
