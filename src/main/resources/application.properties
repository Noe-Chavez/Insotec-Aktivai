spring.datasource.url=jdbc:mysql://207.210.232.7:3306/cctvsegu_sistema_gestion
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Specify the DBMS
spring.jpa.database = MYSQL
spring.sql.init.platform=mysql

# Show or not log for each sql query
spring.jpa.show-sql = true

# Hibernate ddl auto (create, create-drop, update)
spring.jpa.hibernate.ddl-auto=none

# Naming strategy
spring.jpa.hibernate.naming.physical-strategy=org.springframework.boot.orm.jpa.hibernate.SpringPhysicalNamingStrategy

spring.jpa.properties.hibernate.jdbc.time_zone=America/Mexico_City
# stripped before adding them to the entity manager
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQL5InnoDBDialect
spring.jpa.defer-datasource-initialization=true

spring.sql.init.mode=never

logging.level.org.hibernate.sql=INFO
logging.level.org.hibernate.type=INFO
logging.level.com.uacm.aktivai=INFO


spring.sql.init.encoding=UTF-8

server.port=${PORT:8080}


# CONFIGURACION DE ARCHIVOS
# Habilita la subida de archivos
spring.servlet.multipart.enabled=true
# Directorio temporal para subir archivos a Windows
spring.servlet.multipart.location=${UPLOAD_TEMP_DIR:/tmp}
# Establece el tama�o m�ximo del recurso a subir
spring.servlet.multipart.max-file-size=2MB
# Ruta donde se almacenan las im�genes de los avatrs de los usuarios
aktivai.ruta.avatars=${AVATAR_PATH:/var/app/avatars/}
# Paginacion de 5 en 5 registros 
spring.data.web.pageable.default-page-size=5