<!DOCTYPE html>
<html lang="en"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detalles Usuario</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-datepicker/1.9.0/css/bootstrap-datepicker.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-gH2yIJqKdNHPEq0n4Mqa/HGKIhSkIHeL5AyhkYV8i59U5AR6csBvApHHNl/vI1Bx" crossorigin="anonymous">
    <link th:href="@{/css/estilo.css}" rel="stylesheet">
    <script src="https://kit.fontawesome.com/cab137a5a8.js" crossorigin="anonymous"></script>
</head>
<body>
  <header th:insert="fragments/nav_bar::nav_bar"></header>
  <div class="container">
    <div class="card text-center">
      <div class="card-header">Cliente</div>
      <div class="card-body">
        <img id="imageAvatar" th:src="@{ /avatars/{img} (img=${cliente.avatar}) }" class="rounded-circle imageAvatarDetalles" alt="Sin Avatar">
        <h6 class="card-title" th:text="'Nombres: ' + ${cliente.nombre}">Nombres</h6>
        <h6 class="card-title" th:text="'Apellido Paterno: ' + ${cliente.paterno}">Apellido Paterno</h6>
        <h6 class="card-title" th:text="'Apellido Manterno: ' + ${cliente.nombre}">Apellido Manterno</h6>
        <p class="card-text" th:text="'Razon Social: ' + ${cliente.razonSocial}">Razon Social</p>
        <p class="card-text" th:text="'RFC: ' + ${cliente.rfc}">RFC</p>
        <p class="card-text" th:text="'Contacto: ' + ${cliente.contacto}">Contacto</p>
        <p class="card-text" th:text="'Teléfono Personal: ' + ${cliente.telPersonal}">Teléfono Personal</p>
        <p class="card-text" th:text="'Teléfono Oficina: ' + ${cliente.telOficina}">Teléfono Oficina</p>
        <p class="card-text" th:text="'Correo electrónico: ' + ${cliente.mail}">Correo electrónico</p>
        <p class="card-text" th:text="'Fecha de Creación: ' + ${#dates.format(cliente.fechaCreacion, 'dd/MM/yyyy - HH:mm')}"></p>
        <p class="card-text" th:text="'Rol: ' + ${cliente.roles[0].descripcion}">rol</p>
        <p class="card-text" th:text="${cliente.habilitado}?'Estatus: Activo':' Estatus: Inactivo'">estatus</p>
        <p class="card-text" th:text="'Comentarios: ' + ${cliente.comentarios}">Comentarios</p>
      </div>
      <div>
        <a type="button" th:href="@{/sucursales/tablaSucursales/{id} (id=${cliente.id})}" class="btn btn-primary btn-lg" style="background-color: #17385f;">Sucursales</a>
      </div>
      <div class="card-footer text-muted espacioSuperior25pixeles">
        <dev class="row">
          <div class="col-9"></div>
          <div class="col-3">
            <a type="button" class="btn btn-light" th:href="@{/usuario/carteraClientes}">Regresar a Cartera de Clientes</a>
          </div>
        </dev>
      </div>
    </div>
  </div>

  <footer th:insert="fragments/footer::footer" class="d-flex flex-wrap justify-content-between align-items-center py-3 my-4 border-top"></footer>

  <!-- JavaScript Bundle with Popper -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/js/bootstrap.bundle.min.js"
  integrity="sha384-A3rJD856KowSb7dwlZdYEkO39Gagi7vIsF0jrRAoQmDKKtQBHUuLZ9AsSv4jD4Xa"
  crossorigin="anonymous"></script>
  <script src="https://code.jquery.com/ui/1.12.1/jquery-ui.js"></script>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-datepicker/1.9.0/js/bootstrap-datepicker.min.js"></script>
  <!-- JavaScript para el funcionamiento del modal de detalles de usuario -->
  <script th:src="@{/javascript/ScriptParaModal.js}"></script>

</body>
</html>
