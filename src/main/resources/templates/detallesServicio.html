<!DOCTYPE html>
<html
  xmlns="http://www.w3.org/1999/xhtml"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:sec="http://www.thymeleaf.org/extras/spring-security" >
  <head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-datepicker/1.9.0/css/bootstrap-datepicker.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-gH2yIJqKdNHPEq0n4Mqa/HGKIhSkIHeL5AyhkYV8i59U5AR6csBvApHHNl/vI1Bx" crossorigin="anonymous">
    <link th:href="@{/css/estilo.css}" rel="stylesheet">
    <script src="https://kit.fontawesome.com/cab137a5a8.js" crossorigin="anonymous"></script>
    <title>Detalle de Servicios</title>
  </head>
  <body>

    <header th:insert="fragments/nav_bar::nav_bar"></header>

    <div class="container">
      <div class="card text-center">
        <div class="card-header">Servicio</div>
      <div class="card-body">
        <h4 class="card-title" th:text="'Sucursal: ' + ${servicio.tipoServicio}"></h4>
        <h6 class="card-title" th:text="'Categoria: ' + ${servicio.categoria}"></h6>
        <h6 class="card-title" th:text="'Categoria: ' + ${servicio.descripcion}"></h6>
        <p class="card-text" th:text="'Costo: $' + ${servicio.costo}"></p>
        <p class="card-text" th:text="'Fecha de instlación: ' + ${#dates.format(servicio.inicioInstalacion, 'dd/MM/yyyy - HH:mm')}"></p>
        <p class="card-text" th:text="'Fecha de termino de intalación: ' + ${#dates.format(servicio.finInstalacion, 'dd/MM/yyyy - HH:mm')}"></p>
      </div>
      <div class="card-footer text-muted">
        <a type="button" class="btn btn-primary btn-lg" style="background-color: #17385f;">Póliza</a>
        <a type="button" class="btn btn-primary btn-lg" style="background-color: #17385f;">Pagos</a>
        <!-- <a type="button" class="btn btn-secondary" th:href="@{/servicios/tablaServicios/{folio} (folio=${servicio.sucursal.folio})}">Regresar a servicios</a> -->
      </div>
      <a type="button" class="btn btn-secondary">Regresar a servicios</a> 
    </div>
      </div>
    </div>
  
    <footer th:insert="fragments/footer::footer" class="d-flex flex-wrap justify-content-between align-items-center py-3 my-4 border-top"></footer>
    
    <!-- JavaScript Bundle with Popper -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/js/bootstrap.bundle.min.js"
  integrity="sha384-A3rJD856KowSb7dwlZdYEkO39Gagi7vIsF0jrRAoQmDKKtQBHUuLZ9AsSv4jD4Xa"
  crossorigin="anonymous"></script>
  <script src="https://code.jquery.com/ui/1.12.1/jquery-ui.js"></script>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-datepicker/1.9.0/js/bootstrap-datepicker.min.js"></script>
  <!-- JavaScript para el funcionamiento del modal de detalles de usuario -->
  <script th:src="@{/javascript/ScriptParaModal.js}"></script>

  </body>
</html>
