<!DOCTYPE html>
<html lang="en"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detalles Sucursal</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-datepicker/1.9.0/css/bootstrap-datepicker.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-gH2yIJqKdNHPEq0n4Mqa/HGKIhSkIHeL5AyhkYV8i59U5AR6csBvApHHNl/vI1Bx" crossorigin="anonymous">
    <link th:href="@{/css/estilo.css}" rel="stylesheet">
    <script src="https://kit.fontawesome.com/cab137a5a8.js" crossorigin="anonymous"></script>
</head>
<body>
  <header th:insert="fragments/nav_bar::nav_bar"></header>
  <div class="container">
    <div class="card text-center">
      <div class="card-header">Sucursal</div>
      <div class="card-body">
        <h6 class="card-title" th:text="'Folio: ' + ${sucursal.idSucursal}">Folio</h6>
        <h6 class="card-title" th:text="'Nombre: ' + ${sucursal.nombre}">Nombre</h6>
        <h5>Dirección</h5>
        <h6 class="card-title" th:text="'Calle: ' + ${sucursal.calle}"></h6>
        <h6 class="card-title" th:text="'Numero: ' + ${sucursal.numero}"></h6>
        <h6 class="card-title" th:text="'Colonia: ' + ${sucursal.colonia}"></h6>
        <h6 class="card-title" th:text="'Alcaldia o Municipio: ' + ${sucursal.alcaldia}"></h6>
        <h6 class="card-title" th:text="'Código Postal: ' + ${sucursal.codigoPostal}"></h6>
        <h5>Información de Contacto</h5>
        <h6 class="card-title" th:text="'Nombre del Contacto: ' + ${sucursal.contacto}"></h6>
        <h6 class="card-title" th:text="'Teléfono del Contacto: ' + ${sucursal.telefono}"></h6>
        <h6 class="card-title" th:text="'Correo de Sucursal: ' + ${sucursal.correo}"></h6>
        <h6 class="card-title" th:text="'Teléfono de Sucursal: ' + ${sucursal.telefono}"></h6>
        <div>
            <a type="button" th:href="@{/servicios/tablaServicios/{idSucursal} (idSucursal=${sucursal.idSucursal})}"  class="btn btn-primary btn-lg" style="background-color: #17385f;">Servicios</a>
        </div>
      </div>
      <div class="card-footer text-muted">
        <dev class="row">
          <div class="col-9"></div>
          <div class="col-3">
            <!-- <a type="button" class="btn btn-light" th:href="@{/sucursales/tablaSucursales/{id} (id=${cliente.id})}">Regresar a Sucursales</a>-->
          </div>
        </div>
        </dev>
      </div>
    </div>
  </div>

  <footer th:insert="fragments/footer::footer" class="d-flex flex-wrap justify-content-between align-items-center py-3 my-4 border-top"></footer>

  <!-- JavaScript Bundle with Popper -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/js/bootstrap.bundle.min.js"
  integrity="sha384-A3rJD856KowSb7dwlZdYEkO39Gagi7vIsF0jrRAoQmDKKtQBHUuLZ9AsSv4jD4Xa"
  crossorigin="anonymous"></script>
  <script src="https://code.jquery.com/ui/1.12.1/jquery-ui.js"></script>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-datepicker/1.9.0/js/bootstrap-datepicker.min.js"></script>
  <!-- JavaScript para el funcionamiento del modal de detalles de usuario -->
  <script th:src="@{/javascript/ScriptParaModal.js}"></script>

</body>
</html>
