<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <!-- CSS only -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-gH2yIJqKdNHPEq0n4Mqa/HGKIhSkIHeL5AyhkYV8i59U5AR6csBvApHHNl/vI1Bx" crossorigin="anonymous">
    <link th:href="@{/css/estilo.css}" rel="stylesheet">
    <title>Registro de Servicio</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-datepicker/1.9.0/css/bootstrap-datepicker.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <script src="https://kit.fontawesome.com/cab137a5a8.js" crossorigin="anonymous"></script>
    <link th:href="@{/css/estilo.css}" rel="stylesheet">
</head>

<body>
    <header th:insert="fragments/nav_bar::nav_bar"></header>

    <div class="container espacioSuperior25pixeles">
        <div class="container">
            <form th:action="@{/credenciales/guardar}" method="post" class="row g-3 needs-validation" novalidate>

                <h1>Credencial</h1>

                <div class="row espacioSuperior25pixeles">
                    <div class="col-2">
                        <label for="inputUsuario" class="form-label">Usuario</label>
                    </div>
                    <div class="col">
                        <input name="usuario" onkeyup="mayus(this);" type="text" id="numCamaras" class="form-control is-valid" aria-describedby="NumCamaras" placeholder="">
                        <div class="invalid-feedback">
                            Ingrese el número de cámaras.
                        </div>
                    </div>
                </div>

                <div class="row espacioSuperior25pixeles">
                    <div class="col-2">
                        <label for="validationServer01" class="form-label">Tipo</label>
                    </div>
                    <div class="col-10">
                        <input type="text" name="tipo" aria-describedby="name" class="form-control is-valid" id="inputTipo" required>
                        <div class="invalid-feedback">
                            Ingrese el tipo.
                        </div>
                    </div>
                </div>

                <div class="row espacioSuperior25pixeles">
                    <div class="col-2">
                        <label for="validationServer01" class="form-label">Contraseña</label>
                    </div>
                    <div class="col-10">
                        <input type="text" name="password" aria-describedby="name" class="form-control is-valid" id="inputPassword" required>
                        <div class="invalid-feedback">
                            Ingrese la contraseña.
                        </div>
                    </div>
                </div>

                <div class="row espacioSuperior25pixeles">
                    <div class="col-2">
                        <label for="validationServer01" class="form-label">Plataforma</label>
                    </div>
                    <div class="col-10">
                        <textarea onkeyup="mayus(this);" name="descripcion" class="form-control is-valid textareaNoRedimencion" id="textAreaPlataforma" rows="8" placeholder="" required></textarea>
                        <div class="invalid-feedback">
                            Ingrese una descripción de la plataforma.
                        </div>
                    </div>
                </div>

                <div class="row espacioSuperior25pixeles">
                    <div class="col-10">
                    </div>
                    <div class="col-2">
                        <!-- <a href="/home.html" type="button" class="btn btn-secondary">Salir</a> -->
                        <button id="botonFicticio"  type="submit" class="btn text-white" style="background-color: #17385f;">Guardar</button>
                        <a href="/home.html" type="button" class="btn btn-secondary">Salir</a>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <footer th:insert="fragments/footer::footer" class="d-flex flex-wrap justify-content-between align-items-center py-3 my-4 border-top"></footer>

    <!-- JavaScript Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-A3rJD856KowSb7dwlZdYEkO39Gagi7vIsF0jrRAoQmDKKtQBHUuLZ9AsSv4jD4Xa"
        crossorigin="anonymous"></script>
    <script th:src="@{/javascript/ScriptValidaciones.js}"></script>
    <script th:src="@{/javascript/Scripts.js}"></script>
</body>

</html>
