<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <!-- CSS only -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-gH2yIJqKdNHPEq0n4Mqa/HGKIhSkIHeL5AyhkYV8i59U5AR6csBvApHHNl/vI1Bx" crossorigin="anonymous">
    <link th:href="@{/css/estilo.css}" rel="stylesheet">
    <title>Crear Usuario</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-datepicker/1.9.0/css/bootstrap-datepicker.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <script src="https://kit.fontawesome.com/cab137a5a8.js" crossorigin="anonymous"></script>
    <link th:href="@{/css/estilo.css}" rel="stylesheet">
</head>

<body>
    <header th:insert="fragments/nav_bar::nav_bar"></header>
    <form th:action="@{/servicios/guardar/{folio} (folio=${sucursal.folio})}" method="post">
        
            <br>
            <div class="row">
                <div class="col-2">
                    
                    <label for="inputMarca" class="form-label">Usuario Soporte: </label>
                </div>
                <div class="col">
                    <input type="text" id="inputMarca" class="form-control" aria-describedby="folioServicio">
                    
                </div>
                <div class="col-2">
                    
                    <label for="inputModelo" class="form-label">Contraseña Soporte: </label>
                </div>
                <div class="col">
                    <input type="text" id="inputModelo" class="form-control" aria-describedby="folioServicio">
                    
                </div>
            </div>
            <br>
            <div class="row">
                <div class="col-2">
                    
                    <label for="inputMarca" class="form-label">Usuario Administrador(Remoto): </label>
                </div>
                <div class="col">
                    <input type="text" id="inputMarca" class="form-control" aria-describedby="folioServicio">
                    
                </div>
                <div class="col-2">
                    
                    <label for="inputModelo" class="form-label">Contraseña Administrador(Remoto): </label>
                </div>
                <div class="col">
                    <input type="text" id="inputModelo" class="form-control" aria-describedby="folioServicio">
                    
                </div>
            </div>
            <br>
            <div class="row">
                <div class="col-2">
                    
                    <label for="inputMarca" class="form-label">Usuario Cliente: </label>
                </div>
                <div class="col">
                    <input type="text" id="inputMarca" class="form-control" aria-describedby="folioServicio">
                    
                </div>
                <div class="col-2">
                    
                    <label for="inputModelo" class="form-label">Contraseña Cliente: </label>
                </div>
                <div class="col">
                    <input type="text" id="inputModelo" class="form-control" aria-describedby="folioServicio">
                    
                </div>
            </div>
            <br>
            <div class="row">
                <div class="col-2">
                    
                    <label for="inputMarca" class="form-label">Usuario Plataforma: </label>
                </div>
                <div class="col">
                    <input type="text" id="inputMarca" class="form-control" aria-describedby="folioServicio">
                    
                </div>
                <div class="col-2">
                    
                    <label for="inputModelo" class="form-label">Contraseña Plataforma: </label>
                </div>
                <div class="col">
                    <input type="text" id="inputModelo" class="form-control" aria-describedby="folioServicio">
                    
                </div>
            </div>

            
            <a type="button" th:href="@{/servicios/tablaServicios/{folio} (folio=${sucursal.folio})}" class="btn btn-secondary">Cancelar</a>
            <button type="submit" class="btn text-white" style="background-color:  #283968 ;">Siguiente</button>

        </div>
    </form>

    <footer th:insert="fragments/footer::footer" class="d-flex flex-wrap justify-content-between align-items-center py-3 my-4 border-top"></footer>

    <!-- JavaScript Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-A3rJD856KowSb7dwlZdYEkO39Gagi7vIsF0jrRAoQmDKKtQBHUuLZ9AsSv4jD4Xa"
        crossorigin="anonymous"></script>
    <script src="https://code.jquery.com/ui/1.12.1/jquery-ui.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-datepicker/1.9.0/js/bootstrap-datepicker.min.js"></script>
    <script th:src="@{/javascript/Scripts.js}"></script>


</body>

</html>
