<!DOCTYPE html>
<html
  xmlns="http://www.w3.org/1999/xhtml"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:sec="http://www.thymeleaf.org/extras/spring-security" >
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-gH2yIJqKdNHPEq0n4Mqa/HGKIhSkIHeL5AyhkYV8i59U5AR6csBvApHHNl/vI1Bx"
      crossorigin="anonymous" />
    <title>Servicios</title>
    <link th:href="@{/css/estilo.css}" rel="stylesheet" />
  </head>
  <body>

    <header th:insert="fragments/nav_bar::nav_bar"></header>

    <div class="container">
        <h1>Servicios</h1>
        <div id="search-box">
            <form class="d-flex needs-validation" novalidate role="search">
                <input id="palabraClave" class="form-control me-2 is-valid" type="search" name="palabraClave" placeholder="Buscar" th:value="${palabraClave}" aria-label="Buscar" required>
                <button class="btn btn-secondary" type="submit">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>
            </form>
        </div>
        <br>
        <div>
            <a id="button_create" type="button" th:href="@{/servicios/crear}" class="btn text-white" style="background-color: #17385f;">
                + Nuevo Servicio
            </a>
        </div>
        <div th:if="${msg != null}" class="alert alert-success" th:text="${msg}" role="alert"></div>
        <table class="table table-striped table-bordered table-hover">
            <thead class="bg-danger text-white">
            <tr>
                <th scope="col">Folio</th>
                <th scope="col">Tipo Servicio</th>
                <th scope="col">Fecha de Contratación</th>
                <th scope="col">Costo</th>
                <th scope="col">Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr id='trTable' th:each=" servicio : ${servicios}">
                <td th:id="${'folio'+servicio.folio}" th:text="${servicio.folio}"></td>
                <td th:text="${servicio.tipoServicio == '1'}? 'FINANCIADO':'DE CONTADO'"></td>
                <td th:text="${#dates.format(servicio.fechaContratacion, 'dd/MM/yyyy - HH:mm')}"></td> 
                <td th:text="'$' + ${servicio.costo}"></td>
                <td>
                    
                    <a type="button" data-bs-toggle="modal" th:attr="data-bs-target='#detallesClienteModal'+*{servicio.folio}" >
                        <i class="fa-solid fa-eye fa-2x text-secondary"></i>&nbsp;
                    </a>

                    <!-- Modal para detalles de Servicio -->
                    <div class="modal fade" data-bs-backdrop="static" th:id="*{'detallesClienteModal'+{servicio.folio}}" tabindex="-1" aria-labelledby="detallesClienteModalLabel" aria-hidden="true">
                        <div class="modal-dialog">
                            <div class="modal-content">
                            <div class="modal-header text-white" style="background-color: #17385f;">
                            <h1 class="modal-title fs-5" id="detallesClienteModalLabel">Detalles del Servicio</h1>
                            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                            </div>
                            <div class="modal-body">
                                <div class="container">
                                    <div class="row">
                                        <h4 th:text="'Folio: ' + ${servicio.folio}"></h4>
                                        <h4 th:text="${servicio.tipoServicio == '1'}? 'Tipo de Servicio: FINANCIADO':'Tipo de Servicio: DE CONTADO'"></h4>
                                        <div th:switch="${servicio.categoria}">
                                            <div th:case="'1'">
                                                <h4>Categoría: Sistema CCTV</h4>
                                            </div>
                                            <div th:case="'2'">
                                                <h4>Categoría: Sistema de Alarma</h4>
                                            </div>
                                            <div th:case="'3'">
                                                <h4>Categoría: Video Portero</h4>
                                            </div>
                                            <div th:case="'4'">
                                                <h4>Categoría: Control de Acceso</h4>
                                            </div>
                                            <div th:case="'5'">
                                                <h4>Categoría: Redes Inalámbricas</h4>
                                            </div>
                                        </div>
                                        <h4 th:text="${'Contratado: ' + #dates.format(servicio.fechaContratacion, 'dd/MM/yyyy - HH:mm')}"></h4>
                                        <h4 th:text="'Costo: $' + ${servicio.costo}"></h4>
                                        <h4 th:text="'Descripcion: ' + ${servicio.descripcion}"></h4>
                                    </div>
                                </div>
                                <div class="modal-footer">
                                    <a type="button" th:href="@{/equipos/tablaEquipos/{idFolioServicio} (idFolioServicio = ${servicio.folio})}" class="btn text-white" style="background-color: #17385f;">Equipos</a>
                                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Salir</button>
                                </div>
                            </div>
                        </div>
                        </div>
                    </div>

                    <a title="Editar">
                        <i class="fa-solid fa-pen-to-square fa-2x text-secondary"></i>&nbsp;
                    </a>

                </td>
            </tr>
            </tbody>    
        </table>

        <!-- Paginación simple -->

            <ul class="pagination">
                <li class="page-item"><a th:href="@{/servicios/tablaServicios (page=${servicios.number -1})}" class="page-link">Anterior</a></li>
                <li class="page-item"><a th:href="@{/servicios/tablaServicios (page=${servicios.number + 1})}" class="page-link">Siguiente</a></li>
            </ul>
        </nav> -->

    </div>

    <footer th:insert="fragments/footer::footer" class="d-flex flex-wrap justify-content-between align-items-center py-3 my-4 border-top"></footer>
    
    <script
      src="https://kit.fontawesome.com/cab137a5a8.js"
      crossorigin="anonymous" ></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.12.4/jquery.min.js"></script>
    <script src="https://code.jquery.com/ui/1.12.1/jquery-ui.js"></script>

    <!-- JavaScript Bundle with Popper -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-A3rJD856KowSb7dwlZdYEkO39Gagi7vIsF0jrRAoQmDKKtQBHUuLZ9AsSv4jD4Xa"
      crossorigin="anonymous"></script>

  </body>
</html>
