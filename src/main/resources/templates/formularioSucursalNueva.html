<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <!-- CSS only -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-gH2yIJqKdNHPEq0n4Mqa/HGKIhSkIHeL5AyhkYV8i59U5AR6csBvApHHNl/vI1Bx" crossorigin="anonymous">
    <link th:href="@{/css/estilo.css}" rel="stylesheet">
    <title>Crear Sucursal</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-datepicker/1.9.0/css/bootstrap-datepicker.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <script src="https://kit.fontawesome.com/cab137a5a8.js" crossorigin="anonymous"></script>
    <link th:href="@{/css/estilo.css}" rel="stylesheet">

</head>

<body>
    <header th:insert="fragments/nav_bar::nav_bar"></header>
    <form th:action="@{/sucursales/guardar}" method="post" class="espacioSuperior25pixeles row g-3 needs-validation" novalidate>
        <div class="container">
            <h1>Sucursal</h1>
            <div align="center">
                <h5 th:text="${cliente.nombre} + ' ' + ${cliente.paterno} + ' ' + ${cliente.materno}"></h5>
            </div>
            <input name="idCliente" th:value="${cliente.id}" type="hidden" id="inputIdCliente" aria-describedby="folioServicio">
            <div class="row espacioSuperior25pixeles">
                <div class="col-2">
                    <label for="inputNombreSucursal" class="form-label">Nombre de Sucursal: </label>
                </div>
                <div class="col">
                    <input name="nombre" onkeyup="mayus(this);" type="text" id="inputNombreSucursal" class="form-control is-valid" aria-describedby="folioServicio" placeholder="EJ. SUCURSAL MIRAMONTES" required>
                    <div class="invalid-feedback">
                        Ingrese el nombre de la sucursal.
                    </div>
                </div>
            </div>
            <br>
            <div class="row">
                <div class="col-2">
                    
                    <label for="inputCalle" class="form-label">Calle: </label>
                </div>
                <div class="col">
                    <input type="text" onkeyup="mayus(this);" name="calle" id="inputCalle" class="form-control is-valid" aria-describedby="folioServicio" placeholder="EJ. XICO" required>
                    <div class="invalid-feedback">
                        Ingrese la calle.
                    </div>
                </div>
                <div class="col-2">
                    
                    <label for="inputNumero" class="form-label">Número: </label>
                </div>
                <div class="col">
                    <input type="number" onkeyup="mayus(this);" name="numero" id="inputNumero" class="form-control is-valid" aria-describedby="folioServicio" placeholder="EJ. 28" required>
                    <div class="invalid-feedback">
                        Ingrese el número.
                    </div>
                </div>
                <div class="col-2">
                    
                    <label for="inputColonia" class="form-label">Colonia: </label>
                </div>
                <div class="col">
                    <input type="text" onkeyup="mayus(this);" name="colonia" id="inputColonia" class="form-control is-valid" aria-describedby="folioServicio" placeholder="EJ. MIRAVALLES" required>
                    <div class="invalid-feedback">
                        Ingrese la colonia.
                    </div>
                </div>
            </div>
            <br>
            <div class="row">
                <div class="col-2">
                    
                    <label for="inputCodigoPostal" class="form-label">Código Postal: </label>
                </div>
                <div class="col">
                    <input type="number" onkeyup="mayus(this);" name="codigoPostal" id="inputCodigoPostal" class="form-control is-valid" aria-describedby="folioServicio" placeholder="EJ. 09263" required>
                    <div class="invalid-feedback">
                        Ingrese el código postal.
                    </div>
                </div>
                <div class="col-2">
                    
                    <label for="inputAlcaldia" class="form-label">Alcaldía: </label>
                </div>
                <div class="col">
                    <input type="text" onkeyup="mayus(this);" name="alcaldia" id="inputAlcaldia" class="form-control is-valid" aria-describedby="folioServicio" placeholder="EJ. XOCHIMILCO" required>
                    <div class="invalid-feedback">
                        Ingrese la alcandia.
                    </div>
                </div>
            </div>
            <br>
            <div class="row">
                <div class="col-2">
                    
                    <label for="inputContacto" class="form-label">Contacto: </label>
                </div>
                <div class="col">
                    <input type="text" onkeyup="mayus(this);" name="contacto" id="inputContacto" class="form-control is-valid" aria-describedby="folioServicio" placeholder="EJ. INGRID ESTRADA ALTAMIRANO" required>
                    <div class="invalid-feedback">
                        Ingrese el nombre del contacto.
                    </div>
                </div>
                <div class="col-2">
                    
                    <label for="inputTelefono" class="form-label">Teléfono: </label>
                </div>
                <div class="col">
                    <input type="tel" onkeyup="mayus(this);" name="telefono" id="inputTelefono" class="form-control is-valid" aria-describedby="folioServicio" placeholder="EJ. 01 800 789 632" required>
                    <div class="invalid-feedback">
                        Ingrese el Teléfono.
                    </div>
                </div>
            </div>
            <br>
            <div class="row">
                <div class="col-2">
                    <label for="inputCorreo" class="form-label">Correo Electrónico: </label>
                </div>
                <div class="col">
                    <input type="text" onkeyup="mayus(this);" name="correo" id="inputCorreo" class="form-control is-valid" aria-describedby="folioServicio" placeholder="EJ. MIRAMONTES@VENTAS.COM.MX" required>
                    <div class="invalid-feedback">
                        Ingrese el correo electrónico.
                    </div>
                </div>
            </div>
            <br>
            
            <div class="row"> 
                <div class="col-8"></div>  
                <div class="col-4">
                    <a type="button" href="/home.html" id="btn-Registrar" class="btn btn-secondary">Cancelar</a>
                    <button type="submit" id="btn-cancelar" class="btn text-white" style="background-color:  #283968 ;">Guardar</button>
                </div>
            </div>

        </div>
    </form>

    <footer th:insert="fragments/footer::footer" class="d-flex flex-wrap justify-content-between align-items-center py-3 my-4 border-top"></footer>

    <!-- JavaScript Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-A3rJD856KowSb7dwlZdYEkO39Gagi7vIsF0jrRAoQmDKKtQBHUuLZ9AsSv4jD4Xa"
        crossorigin="anonymous"></script>
    <script src="https://code.jquery.com/ui/1.12.1/jquery-ui.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-datepicker/1.9.0/js/bootstrap-datepicker.min.js"></script>

    <script th:src="@{/javascript/Scripts.js}"></script>
    <script th:src="@{/javascript/ScriptValidaciones.js}"></script>

</body>

</html>
